<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bộ máy tổ chức - Bộ Nội vụ</title>
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Bộ Nội vụ</div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="co-cau">Cơ cấu tổ chức</button>
      <button class="tab" role="tab" data-view="phoi-hop">Phối hợp</button>
    </nav>
    <div class="tools" data-for="co-cau">
      <button id="open-all" class="btn solid">Mở tất cả</button>
      <button id="close-all" class="btn">Thu gọn</button>
    </div>
    <div class="tools" data-for="phoi-hop">
      <button id="ph-clear" class="btn">Bỏ chọn</button>
    </div>
  </header>

  <!-- Thẻ 1: cơ cấu tổ chức dạng cây -->
  <section class="view" id="view-co-cau">
    <div class="hint-bar">Bấm vào một ô để mở hoặc thu gọn tầng bên dưới. Kéo chuột để di chuyển sơ đồ.</div>
    <main id="tree-canvas" class="tree-canvas">
      <div id="tree" class="tree"></div>
    </main>
  </section>

  <!-- Thẻ 2: phối hợp giữa các đơn vị -->
  <section class="view" id="view-phoi-hop">
    <div class="ph-layout">
      <div class="ph-canvas" id="ph-canvas">
        <div class="ph-stage" id="ph-stage">
          <div class="ph-bo">
            <div class="ph-bo-title">Bộ Nội vụ</div>
            <div class="ph-groups" id="ph-groups"></div>
          </div>
          <button class="ph-ext ph-ngang" id="ph-ngang" data-id="ngang">Cơ quan bộ ngang hàng</button>
          <button class="ph-ext ph-dp" id="ph-dp" data-id="dp">Địa phương / Cấp dưới</button>
          <svg class="ph-edges" id="ph-edges"></svg>
          <div class="ph-labels" id="ph-labels"></div>
        </div>
      </div>
      <aside class="ph-side">
        <div class="ph-legend">
          <span><i class="sw noibo"></i>Trong Bộ</span>
          <span><i class="sw dp"></i>Địa phương / Cấp dưới</span>
          <span><i class="sw ngang"></i>Bộ ngang hàng</span>
        </div>
        <div class="ph-detail" id="ph-detail"></div>
      </aside>
    </div>
  </section>

  <script src="co-cau-data.js"></script>
  <script src="co-cau.js"></script>
  <script src="phoi-hop-data.js"></script>
  <script src="phoi-hop.js"></script>
  <script>
  (function () {
    "use strict";
    const views = ["co-cau", "phoi-hop"];
    function show(v) {
      if (!views.includes(v)) v = "co-cau";
      document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.view === v)));
      document.querySelectorAll(".view").forEach((s) => s.classList.toggle("active", s.id === "view-" + v));
      document.querySelectorAll(".tools").forEach((s) => (s.hidden = s.dataset.for !== v));
      if (v === "co-cau" && window.coCauShow) window.coCauShow();
      if (v === "phoi-hop" && window.phoiHopShow) window.phoiHopShow();
    }
    document.querySelectorAll(".tab").forEach((t) =>
      t.addEventListener("click", () => { history.replaceState(null, "", "#" + t.dataset.view); show(t.dataset.view); }));
    window.addEventListener("hashchange", () => show(location.hash.slice(1)));
    show(location.hash.slice(1));
  })();
  </script>
</body>
</html>
